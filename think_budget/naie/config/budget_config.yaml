# ═══════════════════════════════════════════════════════════════════
# 智能Token预算系统 — 统一配置文件
# Unified Budget Configuration for Think Budget Refactored
# ═══════════════════════════════════════════════════════════════════
# 本文件集中管理所有与 Token 预算、难度、任务类型相关的配置项。
# 商业交接时只需修改此文件即可调整系统行为，无需改动业务代码。
# ═══════════════════════════════════════════════════════════════════

# ─── 1. 人工可控超参数 (Human-Controllable Hyperparameters) ───
# 这4个超参数是系统对外暴露的核心控制点，优先级最高
HUMAN_CONTROLLABLE:
  # 是否启用预算控制 — False时模型自由生成不截断
  BUDGET_ENABLED: true

  # 人工设定的固定Token消耗上限 — >0时忽略所有动态计算(历史/难度/任务类型)
  # 设为0则启用动态预算推算
  FIXED_BUDGET_TOKEN: 0

  # 置信度阈值 — decision_score >= 此值且think充足时接受答案
  # 也用于决定是否采纳历史推算结果(历史置信度低于此值时不采纳)
  CONFIDENCE_THRESHOLD: 0.95

  # 历史轨迹百分比步长 — 控制稳定期(hot-start)的预算取值策略
  # 0.75 = 取P75分位数, 0.05 = 按5%步进递增调整
  PERCENTILE_STEP: 0.75


# ─── 2. 任务类型定义与Token映射 (Task Type Definitions) ───
# 每种任务类型有独立的基础Token基数和推理参数
# typical_tokens: 该类型任务的典型thinking token消耗(基础Token基数)
# 新增任务类型只需在此添加一项即可，系统会自动识别
TASK_TYPES:
  retrieval:
    description: "检索任务 — 简单查找/查询, 少推理"
    typical_tokens: 500
    check_length: 200
    think_stride: 100
    num_thinking: 3
    min_think_tokens: 50
    check_answer_len: 2000
    prob_th: 0.90

  classification:
    description: "分类任务 — 选择题/判断题/归类"
    typical_tokens: 800
    check_length: 300
    think_stride: 100
    num_thinking: 4
    min_think_tokens: 100
    check_answer_len: 2000
    prob_th: 0.90

  coding:
    description: "编码任务 — 编程题/代码生成/算法实现"
    typical_tokens: 12000
    check_length: 2000
    think_stride: 500
    num_thinking: 15
    min_think_tokens: 2000
    check_answer_len: 4000
    prob_th: 0.95

  math:
    description: "数学推理 — 证明/计算/方程求解"
    typical_tokens: 8000
    check_length: 1500
    think_stride: 400
    num_thinking: 12
    min_think_tokens: 1500
    check_answer_len: 4000
    prob_th: 0.95

  reasoning:
    description: "逻辑推理 — 多步推导/条件推理"
    typical_tokens: 5000
    check_length: 800
    think_stride: 300
    num_thinking: 8
    min_think_tokens: 500
    check_answer_len: 3000
    prob_th: 0.93

  tool_call:
    description: "工具调用 — API调用/参数填充"
    typical_tokens: 1000
    check_length: 400
    think_stride: 200
    num_thinking: 8
    min_think_tokens: 100
    check_answer_len: 4000
    prob_th: 0.95

  fault_diagnosis:
    description: "故障诊断 — 告警分析/根因定位"
    typical_tokens: 1500
    check_length: 500
    think_stride: 200
    num_thinking: 8
    min_think_tokens: 200
    check_answer_len: 4000
    prob_th: 0.95

  knowledge_qa:
    description: "知识问答 — 事实问答/解释说明"
    typical_tokens: 3000
    check_length: 600
    think_stride: 200
    num_thinking: 6
    min_think_tokens: 200
    check_answer_len: 3000
    prob_th: 0.92

  planning:
    description: "任务规划 — 多步骤规划/工作流编排"
    typical_tokens: 2500
    check_length: 600
    think_stride: 200
    num_thinking: 8
    min_think_tokens: 300
    check_answer_len: 3000
    prob_th: 0.93

  general:
    description: "兜底通用 — 无法判断时使用"
    typical_tokens: 3000
    check_length: 500
    think_stride: 200
    num_thinking: 8
    min_think_tokens: 200
    check_answer_len: 3000
    prob_th: 0.93

# 任务类型分类优先级(高→低) — 同时匹配多种类型时按此顺序选取
TASK_TYPE_PRIORITY:
  - coding
  - math
  - reasoning
  - planning
  - fault_diagnosis
  - tool_call
  - classification
  - retrieval
  - knowledge_qa
  - general


# ─── 3. 难度梯度配置 (Difficulty Tier Configuration) ───
# 难度等级与乘数倍率完全由配置控制，禁止在函数体内硬编码
# difficulty_estimator 输出连续值 d∈[0,1], 此处定义离散等级映射
# 每个等级定义一个乘数，用于调整基础Token基数(typical_tokens × multiplier)
DIFFICULTY_TIERS:
  easy:       # d ∈ [0, 0.3) — 简单题
    difficulty_range: [0.0, 0.3]
    token_multiplier: 0.8      # 基础Token基数的80%
    check_length_factor: 0.3   # 最大check_length的30%
    stride_factor: 0.3
    num_thinking_min: 3
    num_thinking_max: 6

  medium:     # d ∈ [0.3, 0.6) — 中等题
    difficulty_range: [0.3, 0.6]
    token_multiplier: 1.0      # 基础Token基数不变
    check_length_factor: 0.6
    stride_factor: 0.6
    num_thinking_min: 5
    num_thinking_max: 10

  hard:       # d ∈ [0.6, 0.8) — 困难题
    difficulty_range: [0.6, 0.8]
    token_multiplier: 1.5      # 基础Token基数的150%
    check_length_factor: 0.8
    stride_factor: 0.8
    num_thinking_min: 8
    num_thinking_max: 15

  very_hard:  # d ∈ [0.8, 1.0] — 极难题
    difficulty_range: [0.8, 1.0]
    token_multiplier: 2.0      # 基础Token基数的200%
    check_length_factor: 1.0
    stride_factor: 1.0
    num_thinking_min: 10
    num_thinking_max: 20


# ─── 4. 历史轨迹预算策略 (History Trajectory Budget Strategy) ───
# 三段式泛化策略的核心参数

# 阶段A: 新任务出现(零历史)
HISTORY_NEW_TASK:
  # 新任务不设Budget限制 — True=赋予极大值(99999), False=使用任务类型默认值
  unlimited: true
  # 不设限制时的占位值
  unlimited_budget_placeholder: 99999
  # 新任务检测相似度阈值 — Jaccard < 此值判为新任务
  new_task_similarity_threshold: 0.3

# 阶段B: 冷启动(1~warmup_count条历史)
HISTORY_WARM_START:
  # warm-start条数阈值 — 历史≤此数用warm-start策略
  warmup_count: 3
  # 预算乘数 — 历史avg_tokens × 此值作为初始预算
  # 1.2 = 在历史均值基础上多20%余量避免低估
  multiplier: 1.2
  # 策略选择: conservative(保守1.5x)/moderate(适中1.2x)/aggressive(激进1.0x)
  strategy: "moderate"
  # 高方差(cv>0.5)时的额外乘数修正
  high_variance_boost:
    conservative: 1.3    # conservative: 1.2 × 1.3 = 1.56
    moderate: 1.1        # moderate: 1.2 × 1.1 = 1.32
    aggressive: 1.0      # aggressive: 1.0 × 1.0 = 1.0 (不额外放大)

# 阶段C: 稳定期(>warmup_count条历史)
HISTORY_HOT_START:
  # 百分位步长 — 取历史token消耗的P75分位数作为预算基准
  # 对应 HUMAN_CONTROLLABLE.PERCENTILE_STEP
  stride_percentile: 0.75
  # 低成功率(<0.7)时的预算放大系数
  low_success_boost: 1.3
  # 高失败率(>0.3)时的步长缩减系数(更精细步进)
  high_failure_stride_factor: 0.8

# 自动注册机制
AUTO_REGISTRATION:
  # 自动聚类新任务类型的历史条数阈值
  # 同类型历史积累超过此数自动注册为自定义任务类型
  auto_cluster_threshold: 5
  # 注册后的预算推算: 使用p75_tokens作为typical_tokens


# ─── 5. 场景类型定义 (Scene Type Definitions) ───
# scene_classifier 使用的场景分类及其typical_tokens先验
SCENE_TYPES:
  tool_call:
    typical_tokens: 1000
    token_range: [500, 2000]
  fault_diagnosis:
    typical_tokens: 1500
    token_range: [800, 3000]
  math_reasoning:
    typical_tokens: 8000
    token_range: [3000, 22000]
  code_generation:
    typical_tokens: 12000
    token_range: [5000, 20000]
  knowledge_qa:
    typical_tokens: 3000
    token_range: [1000, 7000]
  retrieval:
    typical_tokens: 500
    token_range: [200, 2000]
  classification:
    typical_tokens: 800
    token_range: [300, 3000]
  planning:
    typical_tokens: 2500
    token_range: [1000, 5000]
  general:
    typical_tokens: 3000
    token_range: [500, 15000]
