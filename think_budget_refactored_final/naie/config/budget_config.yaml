# ═══════════════════════════════════════════════════════════════════
# 智能Token预算系统 — 统一配置文件
# Unified Budget Configuration for Think Budget Refactored
# ═══════════════════════════════════════════════════════════════════
# 本文件集中管理所有与 Token 预算、难度、任务类型相关的配置项。
# 商业交接时只需修改此文件即可调整系统行为，无需改动业务代码。
# ═══════════════════════════════════════════════════════════════════

# ─── 1. 人工可控超参数 (Human-Controllable Hyperparameters) ───
HUMAN_CONTROLLABLE:
  BUDGET_ENABLED: true
  FIXED_BUDGET_TOKEN: 0
  CONFIDENCE_THRESHOLD: 0.95
  PERCENTILE_STEP: 0.75


# ─── 2. 任务类型定义与Token映射 (Task Type Definitions) ───
TASK_TYPES:
  retrieval:
    description: "检索任务 — 简单查找/查询, 少推理"
    typical_tokens: 500
    check_length: 200
    think_stride: 100
    num_thinking: 3
    min_think_tokens: 50
    check_answer_len: 2000
    prob_th: 0.90

  statistics_aggregation:
    description: "statistics aggregation / count and sum over tabular statistics"
    typical_tokens: 4000
    check_length: 800
    think_stride: 300
    num_thinking: 6
    min_think_tokens: 600
    check_answer_len: 4000
    prob_th: 0.90

  classification:
    description: "分类任务 — 选择题/判断题/归类"
    typical_tokens: 800
    check_length: 300
    think_stride: 100
    num_thinking: 4
    min_think_tokens: 100
    check_answer_len: 2000
    prob_th: 0.90

  coding:
    description: "编码任务 — 编程题/代码生成/算法实现"
    typical_tokens: 12000
    check_length: 2000
    think_stride: 500
    num_thinking: 15
    min_think_tokens: 2000
    check_answer_len: 4000
    prob_th: 0.95

  math:
    description: "数学推理 — 证明/计算/方程求解"
    typical_tokens: 8000
    check_length: 1500
    think_stride: 400
    num_thinking: 12
    min_think_tokens: 1500
    check_answer_len: 4000
    prob_th: 0.95

  reasoning:
    description: "逻辑推理 — 多步推导/条件推理"
    typical_tokens: 5000
    check_length: 800
    think_stride: 300
    num_thinking: 8
    min_think_tokens: 500
    check_answer_len: 3000
    prob_th: 0.93

  tool_call:
    description: "工具调用 — API调用/参数填充"
    typical_tokens: 1000
    check_length: 400
    think_stride: 200
    num_thinking: 8
    min_think_tokens: 100
    check_answer_len: 4000
    prob_th: 0.95

  fault_diagnosis:
    description: "故障诊断 — 告警分析/根因定位"
    typical_tokens: 1500
    check_length: 500
    think_stride: 200
    num_thinking: 8
    min_think_tokens: 200
    check_answer_len: 4000
    prob_th: 0.95

  knowledge_qa:
    description: "知识问答 — 事实问答/解释说明"
    typical_tokens: 3000
    check_length: 600
    think_stride: 200
    num_thinking: 6
    min_think_tokens: 200
    check_answer_len: 3000
    prob_th: 0.92

  planning:
    description: "任务规划 — 多步骤规划/工作流编排"
    typical_tokens: 2500
    check_length: 600
    think_stride: 200
    num_thinking: 8
    min_think_tokens: 300
    check_answer_len: 3000
    prob_th: 0.93

  general:
    description: "兜底通用 — 无法判断时使用"
    typical_tokens: 3000
    check_length: 500
    think_stride: 200
    num_thinking: 8
    min_think_tokens: 200
    check_answer_len: 3000
    prob_th: 0.93

# 任务类型分类优先级(高→低)
TASK_TYPE_PRIORITY:
  - coding
  - math
  - reasoning
  - planning
  - fault_diagnosis
  - tool_call
  - statistics_aggregation
  - classification
  - retrieval
  - knowledge_qa
  - general


# ─── 3. 难度梯度配置 (Difficulty Tier Configuration) ───
DIFFICULTY_TIERS:
  easy:
    difficulty_range: [0.0, 0.3]
    token_multiplier: 0.8
    check_length_factor: 0.3
    stride_factor: 0.3
    num_thinking_min: 3
    num_thinking_max: 6

  medium:
    difficulty_range: [0.3, 0.6]
    token_multiplier: 1.0
    check_length_factor: 0.6
    stride_factor: 0.6
    num_thinking_min: 5
    num_thinking_max: 10

  hard:
    difficulty_range: [0.6, 0.8]
    token_multiplier: 1.5
    check_length_factor: 0.8
    stride_factor: 0.8
    num_thinking_min: 8
    num_thinking_max: 15

  very_hard:
    difficulty_range: [0.8, 1.0]
    token_multiplier: 2.0
    check_length_factor: 1.0
    stride_factor: 1.0
    num_thinking_min: 10
    num_thinking_max: 20


# ─── 4. 历史轨迹预算策略 (History Trajectory Budget Strategy) ───
HISTORY_NEW_TASK:
  unlimited: true
  unlimited_budget_placeholder: 99999
  new_task_similarity_threshold: 0.3

HISTORY_WARM_START:
  warmup_count: 3
  multiplier: 1.2
  strategy: "moderate"
  high_variance_boost:
    conservative: 1.3
    moderate: 1.1
    aggressive: 1.0

HISTORY_HOT_START:
  stride_percentile: 0.75
  low_success_boost: 1.3
  high_failure_stride_factor: 0.8

AUTO_REGISTRATION:
  auto_cluster_threshold: 5


# ─── 5. 场景类型定义 (Scene Type Definitions) ───
SCENE_TYPES:
  tool_call:
    typical_tokens: 1000
    token_range: [500, 2000]
  fault_diagnosis:
    typical_tokens: 1500
    token_range: [800, 3000]
  math_reasoning:
    typical_tokens: 8000
    token_range: [3000, 22000]
  code_generation:
    typical_tokens: 12000
    token_range: [5000, 20000]
  knowledge_qa:
    typical_tokens: 3000
    token_range: [1000, 7000]
  retrieval:
    typical_tokens: 500
    token_range: [200, 2000]
  classification:
    typical_tokens: 800
    token_range: [300, 3000]
  planning:
    typical_tokens: 2500
    token_range: [1000, 5000]
  general:
    typical_tokens: 3000
    token_range: [500, 15000]


# ─── 6. 模型客户端配置 (Model Client Configuration) ───
MODEL_CLIENT:
  # 生产环境必须校验证书；仅在受控的本地测试环境才可显式关闭。
  verify_ssl: true
  # OpenAI-compatible local/internal backends may not require auth, but the
  # OpenAI SDK still requires a non-empty api_key when constructing the client.
  dummy_api_key: "sk-gDdTT07VGCb6keLFBeD8C24145F343B3AeC515Db920d6c0b"
  # 重试参数
  max_retries: 3
  retry_delay: 2.0

  # 超时参数(秒)
  timeout:
    total: 180.0
    connect: 30.0
    read: 240.0
    write: 30.0
    pool: 30.0

  # 连接池参数(同步/异步分别配置)
  connection_pool:
    sync:
      max_connections: 16
      max_keepalive_connections: 4
      keepalive_expiry: 30.0
    async:
      max_connections: 32
      max_keepalive_connections: 8
      keepalive_expiry: 30.0

  # API 请求默认参数
  payload_defaults:
    temperature: 0
    logprobs: true
    extra_body:
      chat_template_kwargs:
        enable_thinking: false


# ─── 7. 安全门配置 (Safety Gate Configuration) ───
SAFETY_GATE:
  # 软触发倍率 — elapsed > baseline_time_limit × 此值 → 允许当前轮但警告
  soft_trigger_multiplier: 1.0
  # 硬触发倍率 — elapsed > baseline_time_limit × 此值 → 立即回退
  hard_trigger_multiplier: 1.5
  # Budget模式时间扩增系数 — 1.0 + factor × min(num_thinking, cap)
  budget_amplify_factor: 0.5
  budget_amplify_cap: 4
  # 时间扩增上限倍率 — baseline_time_limit × cap_multiplier
  budget_time_cap_multiplier: 3.0


# ─── 8. BudgetForcing 核心常量 (BudgetForcing Core Constants) ───
BUDGET_FORCING:
  # 答案生成最大token — 保证任何长度答案完整输出
  unlimited_answer_tokens: 30000
  # 置信度试探答案最大token — hidden probe，与最终答案长度完全解耦
  trial_answer_tokens: 100
  # 自然断点字符 — 截断时在此类字符处闭合
  natural_break_chars: ["。", "！", "？", ".", "!", "?", "\n", "}", "】", "」"]
  # 自然断点回溯搜索范围(字符数)
  natural_break_search_range: 500
  # warm_start 中 min_think_tokens = max(default, budget × ratio)
  min_think_ratio_warm: 0.3
  # hot_start 中 min_think_tokens = max(default, budget × ratio)
  min_think_ratio_hot: 0.2
  # thinking_words 停止词列表
  thinking_words:
    - "等一下"
    - "等等"
    - "不过"
    - "此外"
    - "但是"
    - "Wait"
    - "wait"
    - "Hmm"
    - "hmm"
    - "Alternatively"
    - "alternatively"
    - "However"
    - "however"


# ─── 9. Prompt 格式配置 (Prompt Format Configuration) ───
PROMPT_FORMAT:
  # 思考标签(加密标签，防止模型误生成)
  think_open_tag: "iesa"
  think_close_tag: "eiraot"
  # Chat template 格式片段
  user_prefix: "<|im_start|>user\n"
  user_suffix: "<|im_end|>\n<|im_start|>assistant\n"
  think_suffix: "\n"


# ─── 10. 历史模块配置 (History Module Configuration) ───
HISTORY_MODULE:
  # 最多保留记录条数
  max_entries: 5000
  # 超过此天数的记录自动淘汰
  max_age_days: 7
  # 每写入N条触发一次淘汰
  evict_every_n_writes: 50
  # 聚合统计缓存TTL(秒)
  stats_cache_ttl: 60.0


# ─── 11. 难度估计器配置 (Difficulty Estimator Configuration) ───
DIFFICULTY_ESTIMATOR:
  # 重复短语检测最小长度
  repeat_phrase_threshold: 15
  # 难度分数上限
  max_difficulty_score: 1.0
  # 历史权重warm-up阈值 — 历史条数达到此值后 history_weight=1.0
  history_warmup_threshold: 10
  # math/code/logic 检测到时 difficulty 最低此值
  hard_floor: 0.8

  # 问题长度 bins — [阈值, 分数] 对，超过阈值则取对应分数
  question_len_bins:
    - [200, 0.02]
    - [500, 0.05]
    - [800, 0.08]
    - [1500, 0.12]
    - [3000, 0.16]
    - [6000, 0.22]
    - [10000, 0.28]
    - [20000, 0.32]

  # 特征权重 — per_count: 每个匹配加分, cap: 单项上限
  feature_weights:
    entity:
      per_count: 0.04
      cap: 0.12
    constraint:
      per_count: 0.05
      cap: 0.12
    ambiguity:
      per_count: 0.03
      cap: 0.08
    multi_tool: 0.08
    cross_turn: 0.06
    validation: 0.05

  # 难度→budget 分段映射参数
  difficulty_mapping:
    # 分段分割点 — [LOW上限, MED上限], HIGH = [MED上限, 1.0]
    segments: [0.3, 0.6]
    # HIGH+VHIGH区幂函数指数 — 值<1加速增长(0.7=高端加速)
    power_exponent: 0.7


# ─── 12. NAIE 结构Token键名 (NAIE Structural Token Key Names) ───
# 这些键名在JSON答案中是可预测的结构token(高logprob)，
# 不应参与Value Min Confidence计算
