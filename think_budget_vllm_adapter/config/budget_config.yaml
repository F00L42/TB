# Think Budget 预算配置文件
# 放置于 think_budget_vllm_adapter/config/ 目录下
# 如果此文件不存在，程序使用 _get_default_config() 中的内置默认值

HUMAN_CONTROLLABLE:
  BUDGET_ENABLED: true
  FIXED_BUDGET_TOKEN: 0
  CONFIDENCE_THRESHOLD: 0.95
  PERCENTILE_STEP: 0.75

TASK_TYPES:
  retrieval:
    description: 检索任务
    typical_tokens: 500
    check_length: 200
    think_stride: 100
    num_thinking: 3
    min_think_tokens: 50
    check_answer_len: 2000
    prob_th: 0.90
  classification:
    description: 分类任务
    typical_tokens: 800
    check_length: 300
    think_stride: 100
    num_thinking: 4
    min_think_tokens: 100
    check_answer_len: 2000
    prob_th: 0.90
  coding:
    description: 编码任务
    typical_tokens: 12000
    check_length: 2000
    think_stride: 500
    num_thinking: 15
    min_think_tokens: 2000
    check_answer_len: 4000
    prob_th: 0.95
  math:
    description: 数学推理
    typical_tokens: 8000
    check_length: 1500
    think_stride: 400
    num_thinking: 12
    min_think_tokens: 1500
    check_answer_len: 4000
    prob_th: 0.95
  reasoning:
    description: 逻辑推理
    typical_tokens: 5000
    check_length: 800
    think_stride: 300
    num_thinking: 8
    min_think_tokens: 500
    check_answer_len: 3000
    prob_th: 0.93
  tool_call:
    description: 工具调用
    typical_tokens: 1000
    check_length: 400
    think_stride: 200
    num_thinking: 8
    min_think_tokens: 100
    check_answer_len: 4000
    prob_th: 0.95
  fault_diagnosis:
    description: 故障诊断
    typical_tokens: 1500
    check_length: 500
    think_stride: 200
    num_thinking: 8
    min_think_tokens: 200
    check_answer_len: 4000
    prob_th: 0.95
  knowledge_qa:
    description: 知识问答
    typical_tokens: 3000
    check_length: 600
    think_stride: 200
    num_thinking: 6
    min_think_tokens: 200
    check_answer_len: 3000
    prob_th: 0.92
  planning:
    description: 任务规划
    typical_tokens: 2500
    check_length: 600
    think_stride: 200
    num_thinking: 8
    min_think_tokens: 300
    check_answer_len: 3000
    prob_th: 0.93
  general:
    description: 兜底通用
    typical_tokens: 3000
    check_length: 500
    think_stride: 200
    num_thinking: 8
    min_think_tokens: 200
    check_answer_len: 3000
    prob_th: 0.93

DIFFICULTY_TIERS:
  easy:
    difficulty_range: [0.0, 0.3]
    token_multiplier: 0.8
    check_length_factor: 0.3
    stride_factor: 0.3
    num_thinking_min: 3
    num_thinking_max: 6
  medium:
    difficulty_range: [0.3, 0.6]
    token_multiplier: 1.0
    check_length_factor: 0.6
    stride_factor: 0.6
    num_thinking_min: 5
    num_thinking_max: 10
  hard:
    difficulty_range: [0.6, 0.8]
    token_multiplier: 1.5
    check_length_factor: 0.8
    stride_factor: 0.8
    num_thinking_min: 8
    num_thinking_max: 15
  very_hard:
    difficulty_range: [0.8, 1.0]
    token_multiplier: 2.0
    check_length_factor: 1.0
    stride_factor: 1.0
    num_thinking_min: 10
    num_thinking_max: 20

TASK_TYPE_PRIORITY:
  - coding
  - math
  - reasoning
  - planning
  - fault_diagnosis
  - tool_call
  - classification
  - retrieval
  - knowledge_qa
  - general

HISTORY_NEW_TASK:
  unlimited: true
  unlimited_budget_placeholder: 99999
  new_task_similarity_threshold: 0.3

HISTORY_WARM_START:
  warmup_count: 3
  multiplier: 1.2
  strategy: moderate
  high_variance_boost:
    conservative: 1.3
    moderate: 1.1
    aggressive: 1.0

HISTORY_HOT_START:
  stride_percentile: 0.75
  low_success_boost: 1.3
  high_failure_stride_factor: 0.8

AUTO_REGISTRATION:
  auto_cluster_threshold: 5

SCENE_TYPES:
  tool_call:
    typical_tokens: 1000
    token_range: [500, 2000]
  fault_diagnosis:
    typical_tokens: 1500
    token_range: [800, 3000]
  math_reasoning:
    typical_tokens: 8000
    token_range: [3000, 22000]
  code_generation:
    typical_tokens: 12000
    token_range: [5000, 20000]
  knowledge_qa:
    typical_tokens: 3000
    token_range: [1000, 7000]
  retrieval:
    typical_tokens: 500
    token_range: [200, 2000]
  classification:
    typical_tokens: 800
    token_range: [300, 3000]
  planning:
    typical_tokens: 2500
    token_range: [1000, 5000]
  general:
    typical_tokens: 3000
    token_range: [500, 15000]
