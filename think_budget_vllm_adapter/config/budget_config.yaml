    check_length: 300
    think_stride: 300
    num_thinking: 3
    min_think_tokens: 300
    max_think_tokens: 1050
    check_answer_len: 50
    prob_th: 0.93
    indicators:
      required_all:
        - "绝对不允许超出“当前诊断思路”"
        - "根据“当前诊断思路”、“已执行记录”"
      strong: []
      weak: []
  netqad_e2e_planning:
