SCENE_PRIORITY:
  - react_whitebox_single_step
  - react_whitebox_overall_planning
  - react_machine_data_analysis
  - kpi_configuration_assurance
  - netqad_e2e_single_step
  - netqad_e2e_planning
  - event_self_closure
  - alarm_diagnosis_advice
  - alarm_diagnosis_conclusion
  - long_context_root_cause
  - complaint_tool_use
  - complaint_classification_zh
  - complaint_classification_en
  - code_generation
  - math_reasoning
  - reasoning
  - planning
  - fault_diagnosis
  - tool_call
  - statistics_aggregation
  - classification
  - retrieval
  - knowledge_qa
  - general

DIFFICULTY_TIERS:
  easy:
    difficulty_range: [0.0, 0.3]
    token_multiplier: 0.8
    check_length_factor: 0.3
    stride_factor: 0.3
    num_thinking_min: 3
    num_thinking_max: 6
  medium:
    difficulty_range: [0.3, 0.6]
    token_multiplier: 1.0
    check_length_factor: 0.6
    stride_factor: 0.6
    num_thinking_min: 5
    num_thinking_max: 10
  hard:
    difficulty_range: [0.6, 0.8]
    token_multiplier: 1.5
    check_length_factor: 0.8
    stride_factor: 0.8
    num_thinking_min: 8
    num_thinking_max: 15
  very_hard:
    difficulty_range: [0.8, 1.0]
    token_multiplier: 2.0
    check_length_factor: 1.0
    stride_factor: 1.0
    num_thinking_min: 10
    num_thinking_max: 20

HISTORY_NEW_TASK:
  unlimited: true
  unlimited_budget_placeholder: 99999

HISTORY_WARM_START:
  warmup_count: 3
  multiplier: 1.2
  strategy: moderate
  high_variance_boost:
    conservative: 1.3
    moderate: 1.1
    aggressive: 1.0

HISTORY_HOT_START:
  stride_percentile: 0.75
  low_success_boost: 1.3
  high_failure_stride_factor: 0.8
